<!DOCTYPE html>
<html lang='en'>
<style>
.button {
    margin-right: 20px; /* space to the right of the button */
}
</style>
<body>
<h1>LOGIN DETAIL</h1>

<form>
 <label for="uname"><b>Username</b></label>
 <input type="text" placeholder="Enter Username" name="uname" required><br><br>


<label for="psw"><b>Password</b></label>
<input type="password" placeholder="Enter Password" name="psw" required><br><br>

 <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number"><br><br>

 <form action="/submit" method="post">
        <label for="email">Enter your email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email Address"><br><br>
<label>Select your gender:</label><br>
<input type="radio" id="male" name="gender" value="male" required>
<label for="male">Male</label><br>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label><br>
<input type="radio" id="other" name="gender" value="other">
<label for="other">Other</label><br><br>
<label for="event">select event:</label>
<select id="event" name="event" required>
<option value="">--select an event--</label>
<option value="seminar">Seminar</label>
<option value="workshop">Workshop</label>
<option value="hackothon">Hackothon</label>
</select>
<br><br>
<button class="button">Register</button>
<button>Reset</button>
</form>
</body>
